<!DOCTYPE html>
<html lang="es"><head>
<style>
  #auth-overlay {
    position:fixed; inset:0; background:#f4f6f9; z-index:99999;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family: Arial, Helvetica, sans-serif;
    visibility:visible;
  }
  #auth-overlay .caja {
    background:#fff; border:1px solid #e2e6ec; border-radius:10px; padding:28px 26px;
    width:280px; max-width:88vw; text-align:center; box-shadow:0 4px 18px rgba(0,0,0,.08);
  }
  #auth-overlay h3 { font-size:15px; margin:0 0 4px 0; }
  #auth-overlay p { font-size:12px; color:#777; margin:0 0 16px 0; }
  #auth-overlay input {
    width:100%; padding:11px; font-size:20px; letter-spacing:6px; text-align:center;
    border:1.5px solid #d0d5dd; border-radius:6px; box-sizing:border-box;
  }
  #auth-overlay input:focus { border-color:#1a73e8; outline:none; }
  #auth-overlay button {
    width:100%; margin-top:12px; background:#1a73e8; color:#fff; border:none;
    padding:11px; border-radius:6px; font-size:14px; font-weight:bold; cursor:pointer;
  }
  #auth-overlay .error { color:#c0392b; font-size:12px; margin-top:8px; min-height:16px; }

  #btn-cerrar-sesion {
    position:fixed; top:8px; right:10px; z-index:9000;
    background:#fff; border:1px solid #e2e6ec; color:#888; font-size:11px;
    padding:5px 10px; border-radius:5px; cursor:pointer;
  }
  #btn-cerrar-sesion:hover { background:#fdecea; color:#c0392b; border-color:#f5c6c2; }
</style>
<script>
(function(){
  // Cambia este valor para usar tu propia clave
  var PIN_CORRECTO = '583204';
  var AUTH_KEY = 'contingencia_auth_ok';
  var AUTH_HORAS_VALIDEZ = 12;

  function autenticado(){
    var raw = localStorage.getItem(AUTH_KEY);
    if(!raw) return false;
    try {
      var datos = JSON.parse(raw);
      var horas = (Date.now() - datos.momento) / 3600000;
      return horas < AUTH_HORAS_VALIDEZ;
    } catch(e){ return false; }
  }

  function marcarAutenticado(){
    localStorage.setItem(AUTH_KEY, JSON.stringify({momento: Date.now()}));
  }

  function cerrarSesion(){
    localStorage.removeItem(AUTH_KEY);
    window.location.href = 'menu_contingencia.html';
  }

  function mostrarOverlay(){
    var overlay = document.createElement('div');
    overlay.id = 'auth-overlay';
    overlay.innerHTML =
      '<div class="caja">' +
        '<h3>Contingencia</h3>' +
        '<p>Ingresa la clave de acceso</p>' +
        '<input type="password" id="auth-pin" inputmode="numeric" maxlength="6" autofocus>' +
        '<button id="auth-btn">Entrar</button>' +
        '<div class="error" id="auth-error"></div>' +
      '</div>';
    document.documentElement.appendChild(overlay);

    var input = document.getElementById('auth-pin');
    var boton = document.getElementById('auth-btn');
    var error = document.getElementById('auth-error');

    function intentar(){
      if(input.value.trim() === PIN_CORRECTO){
        marcarAutenticado();
        overlay.remove();
        document.documentElement.style.visibility = 'visible';
        agregarBotonCerrar();
      } else {
        error.textContent = 'Clave incorrecta';
        input.value = '';
        input.focus();
      }
    }
    boton.addEventListener('click', intentar);
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') intentar(); });
  }

  function agregarBotonCerrar(){
    if(document.getElementById('btn-cerrar-sesion')) return;
    var btn = document.createElement('button');
    btn.id = 'btn-cerrar-sesion';
    btn.textContent = 'Cerrar sesión';
    btn.addEventListener('click', cerrarSesion);
    document.body.appendChild(btn);
  }

  // Ocultar todo hasta confirmar autenticación (evita ver el contenido un instante antes del PIN)
  document.documentElement.style.visibility = 'hidden';

  document.addEventListener('DOMContentLoaded', function(){
    if(autenticado()){
      document.documentElement.style.visibility = 'visible';
      agregarBotonCerrar();
    } else {
      mostrarOverlay();
    }
  });
})();
</script>

<script>
function calcularEdad(fechaStr){
  if(!fechaStr) return '';
  var nac = new Date(fechaStr+'T00:00:00');
  var hoy = new Date();
  var anios = hoy.getFullYear() - nac.getFullYear();
  var meses = hoy.getMonth() - nac.getMonth();
  var dias = hoy.getDate() - nac.getDate();
  if(dias < 0){ meses--; dias += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate(); }
  if(meses < 0){ anios--; meses += 12; }
  return anios + ' Años / ' + meses + ' Meses / ' + dias + ' Días';
}

function formatearFechaDDMMAAAA(fechaISO){
  if(!fechaISO) return '';
  var partes = fechaISO.split('-'); // AAAA-MM-DD
  if(partes.length !== 3) return fechaISO;
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

var $cedula = document.getElementById('cedula');
var $apellidos = document.getElementById('apellidos');
var $nombres = document.getElementById('nombres');
var $fecha = document.getElementById('fecha_nac');
var $aseg = document.getElementById('aseguradora');
var $asegOtra = document.getElementById('aseguradora_otra');
var $hintEdad = document.getElementById('hint-edad');
var $btn = document.getElementById('btn-siguiente');

$fecha.addEventListener('input', function(){
  $hintEdad.textContent = calcularEdad($fecha.value);
});

$aseg.addEventListener('change', function(){
  $asegOtra.style.display = ($aseg.value === '__otra__') ? 'block' : 'none';
});

function validar(){
  var ok = $cedula.value.trim() && $apellidos.value.trim() && $nombres.value.trim() && $fecha.value;
  $btn.disabled = !ok;
}
[$cedula,$apellidos,$nombres,$fecha].forEach(function(el){ el.addEventListener('input', validar); });

$btn.addEventListener('click', function(){
  var aseguradora = ($aseg.value === '__otra__') ? $asegOtra.value.trim() : $aseg.value;
  var apellidos = $apellidos.value.trim().toUpperCase();
  var nombres = $nombres.value.trim().toUpperCase();
  var datos = {
    cedula: $cedula.value.trim(),
    apellidos: apellidos,
    nombres: nombres,
    nombre: (apellidos + ' ' + nombres).trim(),
    fecha_nacimiento: formatearFechaDDMMAAAA($fecha.value),
    edad_calculada: calcularEdad($fecha.value),
    aseguradora: aseguradora
  };
  sessionStorage.setItem('contingencia_paciente', JSON.stringify(datos));
  window.location.href = 'menu_contingencia.html';
});
</script>
</body></html>
